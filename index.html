=========================================================
大井町エモ・クエスト (Oimachi Quest)
バージョン: 1.8.1
最終更新日時: 2026年6月7日 (JST)

【フェーズ別実装・アイデア情報】
■ フェーズ1.5（現在）: UI・UX強化版
  - HTML/CSS/JSの1ファイルのみ。
  - スワイプ連続移動対応、カメラ中央固定。
  - マップ上に地名ラベルを表示。
  - 選択肢のランダム表示、全画面スペシャルイベント。
■ フェーズ2: 本格グラフィック強化
  - Canvas利用への完全移行
  - オリジナルドット絵への差し替え
■ フェーズ3: QRコードセーブ
  - ステータスと座標をQRコード化して復帰可能に
■ フェーズ4: DB連携・ソーシャル化＆特殊イベント
  - Firebase等の導入（クラウドセーブ）
  - 非同期オンライン機能
  - タイムリープ機能（※フェーズ1.5にて一部先取り実装済）
  - 変身イベント機能
  - イベントデータの外部化
  - リアルGPS連動機能
  - ショップ機能とお金システム

【運用ルール】
- 今後修正を行う都度、このヘッダーコメントの
  「バージョン」「最終更新日時」を更新すること。
- コメント末尾に、バージョンと更新履歴の詳細も
  残すこと。
- アイデアや履歴は、長くなってもよいので、
  指示がない限りは勝手に履歴を書き換えない
  （削除・要約しない）運用ルールを徹底すること。
- コメントは見やすく、全角４５文字以内で
  改行すること。

【更新履歴】
v1.8.1 (2026-06-07)
  - ゲーム画面イースターエッグ「バニコリタン」の
    カラーをピンク(#ff91c8)からオレンジ(#ff8c2a)に変更。
    スタート画面バニコリタン2・プレイアブル版は変更なし。
v1.8.0 (2026-06-07)
  - バニコリタンをアバターとして選択・プレイ可能に。
    右から2番目のアバター枠にアニメーション付きプレビュー
    を表示。ゲーム中はCanvas描画のバニコリタンが中央に
    固定表示され、移動ごとにウネウネ動く。
    動きスタイルは6歩ごとに自動切替（ころころ/くねくね
    /ぴょんぴょん/ぐるぐる）。
v1.7.0 (2026-06-07)
  - バニコリタン/バニコリタン2 を軟体動物風挙動に刷新。
    胴体: 8点ベジェアメーバブロブ（各点が独立に波打つ）。
    耳: 2セグメント垂れ耳ベジェ（ふにゃふにゃ）。
    手足: ベジェ曲線の中点を垂直にうねらせ触手感を演出。
    ピンク単色統一。サイズをアバター相当(44px/13unit)に縮小。
v1.6.0 (2026-06-07)
  - オープニング画面にバニコリタン2実装。
    セグメント式アクティブ・ラグドール（頭・胴・腕・脚）。
    放置5秒→端からひょっこり、15秒→全画面駆け抜け。
    スーパーバニーマン風の多周波サイン合成で身もだえ挙動。
v1.5.0 (2026-06-06)
  - イースターエッグ「バニコリタン」実装。
    放置タイマーで出現するシュールなキャラクター。
    5秒放置→ひょっこり覗き、15秒放置→駆け抜け。
    Canvas overlayで既存UIに影響なく描画。
v1.4.0 (2026-04-18)
  - 品川歴史館のメッセージを施設紹介に変更。
  - 各イベントの選択肢の数を増やし、毎回ランダム
    に2つ選ばれて表示される仕組みを導入。
  - 確率で発生する全画面のスペシャルイベント機能
    （タイムリープ等）を実装。
  - 品川歴史館で貝塚を選択時、30%の確率で縄文

v1.3.8 (2026-04-18)
  - 蛇窪神社のイベントに「お金を洗う」選択肢を追加。

v1.3.7 (2026-04-18)
  - 体力が0以下になっても減り続け、マイナス表示

v1.3.6 (2026-04-18)

v1.3.5 (2026-04-18)

v1.3.4 (2026-04-18)

v1.3.3 (2026-04-18)
  - パラメータ初期値を修正。ログスクロール改善。
v1.3.2 (2026-04-18)
  - ログエリア拡大。結果コメント表示機能。
v1.3.1 (2026-04-18)
  - マップ分断解消、連続移動対応。
v1.3.0 (2026-04-18)
  - 操作スワイプ化、カメラ追従、地名ラベル。
v1.2.0 (2026-04-18)
  - マップ拡張、実在スポット大量追加。
v1.1.0 (2026-04-18)
  - 名前例ユリ、3桁ポイント化、性別選択。
v1.0.2 (2026-04-18)

v1.0.1 (2026-04-18)

v1.0.0 (2026-04-18)

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大井町エモ・クエスト</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', 'Quicksand', sans-serif;
            background-color: #fdf2f8; 
            color: #4b5563;
            touch-action: none; 
            overscroll-behavior: none;
        }
        
        #map-viewport {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
            background-color: #e0f2fe;
            user-select: none;
            -webkit-user-select: none;
        }

        #map-container {
            position: absolute;
            transition: transform 0.15s linear;
        }

        #map {
            display: grid;
            grid-template-columns: repeat(20, 24px); 
            grid-template-rows: repeat(20, 24px);
            gap: 1px;
            background-color: #9ca3af; 
            border: 4px solid #fbcfe8;
            border-radius: 8px;
            width: max-content;
        }

        .tile {
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px; 
            background-color: #f3f4f6;
            position: relative; 
        }

        .tile-0 { background-color: #dcfce7; }
        .tile-1 { background-color: #e2e8f0; }
        .tile-2 { background-color: #bbf7d0; }
        .tile-4 { background-color: #cbd5e1; }
        .tile-5 { background-color: #bfdbfe; }

        #player-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            z-index: 20;
            pointer-events: none;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
        }

        #bani-player-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 25;
            display: none;
        }

        #log::-webkit-scrollbar {
            display: block;
            width: 6px;
        }
        #log::-webkit-scrollbar-track {
            background: #f9fafb;
        }
        #log::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 4px;
        }

        .delta-val {
            position: absolute;
            right: 0;
            top: -12px;
            font-size: 10px;
            font-weight: bold;
            opacity: 0;
            transition: all 0.5s ease-out;
            pointer-events: none;
        }
        .delta-show {
            opacity: 1;
            transform: translateY(-8px);
        }
        .delta-plus { color: #f43f5e; }
        .delta-minus { color: #3b82f6; }

        @keyframes hungry-shake {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            25% { transform: translate(-52%, -50%) rotate(-5deg); }
            75% { transform: translate(-48%, -50%) rotate(5deg); }
            100% { transform: translate(-50%, -50%) rotate(0deg); }
        }
        .hungry-player {
            animation: hungry-shake 0.3s infinite;
            filter: grayscale(0.8) contrast(1.2);
        }

        /* スペシャルイベント用アニメーション */
        @keyframes warp-in {
            0% { opacity: 0; transform: scale(1.5) rotate(10deg); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); filter: blur(0); }
        }
        .warp-animation {
            animation: warp-in 1s ease-out forwards;
        }

        #banicori2-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 25;
        }

        #banicori-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 30;
        }
    </style>
</head>

        let gameState = {
            player: { name: "ゲスト", avatar: "👧", x: 5, y: 15 },
            stats: { happy: 0, comm: 0, stamina: 50, curiosity: 0, local: 0, money: 500 },
            lastEventId: null,
            stepCount: 0
        };

        const TILE_SIZE = 24; 
        const STEP_SIZE = TILE_SIZE + 1;

        function startGame() {
            const nameInput = document.getElementById('player-name').value;
            if (nameInput.trim() !== "") gameState.player.name = nameInput;
            const avatarRadios = document.getElementsByName('avatar');
            for (let radio of avatarRadios) if (radio.checked) gameState.player.avatar = radio.value;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('ui-name').innerText = gameState.player.name;

            const baniCanvas = document.getElementById('bani-player-canvas');
            if (gameState.player.avatar === '__bani__') {
                document.getElementById('player-center').style.display = 'none';
                baniCanvas.style.display = 'block';
                window.__baniPlayer = new BanicoritanPlayer(baniCanvas);
            } else {
                document.getElementById('player-center').style.display = '';
                document.getElementById('player-center').innerText = gameState.player.avatar;
                baniCanvas.style.display = 'none';
                window.__baniPlayer = null;
            }

            initMap();
            updateCameraPosition();
            updateStatus();
            document.getElementById('log').innerHTML = "";
            logMessage(`豊葉の杜学園からスタートしたよ！`);
            initBanicoritan();
        }

        function initMap() {
            const mapEl = document.getElementById('map');
            mapEl.innerHTML = '';
            for (let y = 0; y < mapData.length; y++) {
                for (let x = 0; x < mapData[y].length; x++) {
                    const tileVal = mapData[y][x];
                    const tileDiv = document.createElement('div');
                    tileDiv.className = `tile tile-${tileVal}`;
                    let char = "";
                    const coordKey = `${x},${y}`;
                    if (specialGraphics[coordKey]) char = specialGraphics[coordKey];
                    else if (tileGraphics[tileVal]) {
                        if (tileVal === 3) {
                            const ev = events[coordKey];
                            char = (ev && ev.played && !ev.reusable) ? "" : tileGraphics[tileVal];
                        } else char = tileGraphics[tileVal];
                    }
                    if(char) tileDiv.innerText = char;
                    if (events[coordKey]) {
                        const ev = events[coordKey];
                        if (!(ev.played && !ev.reusable)) {
                            const label = document.createElement('div');
                            label.className = "absolute -top-4 left-1/2 transform -translate-x-1/2 bg-white bg-opacity-95 px-1.5 py-0.5 rounded text-[9px] font-bold whitespace-nowrap text-pink-600 shadow-sm border border-pink-200 z-10 pointer-events-none";
                            label.innerText = ev.title.trim();
                            tileDiv.appendChild(label);
                        }
                    }
                    mapEl.appendChild(tileDiv);
                }
            }
        }

        function updateCameraPosition() {
            const viewport = document.getElementById('map-viewport');
            const px = (gameState.player.x * STEP_SIZE) + (TILE_SIZE / 2);
            const py = (gameState.player.y * STEP_SIZE) + (TILE_SIZE / 2);
            const mapX = (viewport.clientWidth / 2) - px;
            const mapY = (viewport.clientHeight / 2) - py;
            document.getElementById('map-container').style.transform = `translate(${mapX}px, ${mapY}px)`;
        }

        function showDelta(type, val) {
            if (val === 0) return;
            const el = document.getElementById(`delta-${type}`);
            const diffEl = document.getElementById(`stat-diff-${type}`);
            diffEl.innerText = (val > 0 ? `(+${val})` : `(${val})`);
            el.innerText = (val > 0 ? `+${val}` : val);
            el.className = `delta-val delta-show ${val > 0 ? 'delta-plus' : 'delta-minus'}`;
            setTimeout(() => { el.classList.remove('delta-show'); }, 1000);
        }

        function clearAllDeltas() {
            const keys = ["happy", "comm", "stamina", "curiosity", "local", "money"];
            keys.forEach(key => { document.getElementById(`stat-diff-${key}`).innerText = ''; });
        }

        function updateStatus(deltas = {}) {
            for (let key in gameState.stats) {
                const statEl = document.getElementById(`stat-${key}`);
                if (!statEl) continue;
                statEl.innerText = gameState.stats[key];
                if (key === 'stamina') {
                    if (gameState.stats[key] <= 0) {
                        statEl.classList.add('text-red-600');
                        statEl.classList.remove('text-green-500');
                        document.getElementById('player-center').classList.add('hungry-player');
                    } else {
                        statEl.classList.remove('text-red-600');
                        statEl.classList.add('text-green-500');
                        document.getElementById('player-center').classList.remove('hungry-player');
                    }
                }
                if (deltas[key] !== undefined && deltas[key] !== 0) showDelta(key, deltas[key]);
            }
            const total = gameState.stats.happy + gameState.stats.comm + gameState.stats.curiosity + gameState.stats.local;
            const avg = total / 4;
            let className = "おうち大好きっ子";
            if (avg >= 300) className = "大井町インフルエンサー👑";
            else if (avg >= 150) className = "アクティブおでかけ女子✨";
            else if (avg >= 50) className = "ご近所リサーチャー🔍";
            document.getElementById('ui-class').innerText = className;
        }

        function getAvatarDisplay() {
            return gameState.player.avatar === '__bani__' ? '🐰' : gameState.player.avatar;
        }

        function logMessage(msg, isPlayer = false) {
            const logEl = document.getElementById('log');
            const p = document.createElement('div');
            if (isPlayer) {
                p.innerText = `${getAvatarDisplay()} ${msg}`;
                p.className = "mb-3 mt-1 text-pink-700 font-bold bg-pink-100 bg-opacity-50 p-2 rounded-lg border border-pink-200";
            } else {
                p.innerText = `> ${msg}`;
                p.className = "mb-1 text-gray-600";
            }
            logEl.appendChild(p);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function movePlayer(dx, dy) {
            if (!document.getElementById('event-modal').classList.contains('hidden') || !document.getElementById('special-screen').classList.contains('hidden')) return;
            clearAllDeltas();

            const newX = gameState.player.x + dx;
            const newY = gameState.player.y + dy;
            if (newX < 0 || newX >= mapData[0].length || newY < 0 || newY >= mapData.length) return;
            const targetTile = mapData[newY][newX];
            if ([1, 2, 4, 5].includes(targetTile)) return;

            gameState.player.x = newX;
            gameState.player.y = newY;
            
            let deltas = { stamina: -2 };
            
            if (Math.abs(newX - 13) <= 2 && Math.abs(newY - 4) <= 2) {
                if (Math.random() < 0.05) {
                    deltas.stamina = -10;
                    logMessage("【ハプニング！】トラックス周辺が混んでて人にぶつかっちゃった…");
                }
            }

            gameState.stats.stamina += deltas.stamina;

            if (gameState.stats.stamina <= 0 && gameState.stats.stamina - deltas.stamina > 0) {
                logMessage("😱 おなかがすいてフラフラ…体力がマイナスになっちゃった！");
            }

            updateCameraPosition();
            updateStatus(deltas);
            checkEvent(newX, newY);
            if (window.__baniPlayer) window.__baniPlayer.onMove(dx, dy);
        }

        function checkEvent(x, y) {
            const key = `${x},${y}`;
            const ev = events[key];
            if (ev) {
                if (ev.reusable && ev.id === gameState.lastEventId) {
                    return;
                }
                if (!ev.played || ev.reusable) {
                    showEventModal(ev, key);
                }
            }
        }

        // 配列からランダムに指定個数を選ぶユーティリティ関数
        function getRandomChoices(arr, count) {
            const shuffled = [...arr].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        function showEventModal(ev, key) {
            isSwiping = false;
            document.getElementById('event-illustration').innerText = ev.illustration || "✨";
            document.getElementById('event-title').innerText = ev.title;
            document.getElementById('event-text').innerText = ev.text;
            const choicesContainer = document.getElementById('event-choices');
            choicesContainer.innerHTML = '';

            // ★選択肢の中からランダムに2つピックアップ（2つ以下の場合は全部）
            const displayChoices = getRandomChoices(ev.choices, Math.min(2, ev.choices.length));

            displayChoices.forEach((choice) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-pink-50 hover:bg-pink-100 text-gray-700 py-3 px-4 rounded-xl text-sm border border-pink-200 transition font-bold shadow-sm";
                btn.innerText = choice.text;
                btn.onclick = () => handleChoice(ev, key, choice);
                choicesContainer.appendChild(btn);
            });
            document.getElementById('event-modal').classList.remove('hidden');
        }

        function handleChoice(ev, key, choice) {
            clearAllDeltas();
            document.getElementById('event-modal').classList.add('hidden');

            // ★スペシャルイベント発生判定
            if (choice.special && Math.random() < choice.special.probability) {
                triggerSpecialEvent(ev, choice.special);
                return; // 通常の処理はスキップ
            }

            // 通常処理
            let deltas = choice.stats || {};
            for (let k in deltas) {
                if (gameState.stats[k] !== undefined) {
                    gameState.stats[k] += deltas[k];
                }
            }

            ev.played = true;
            if (ev.reusable) {
                gameState.lastEventId = ev.id;
            } else {
                gameState.lastEventId = null;
            }

            initMap(); 
            updateStatus(deltas);
            logMessage(`【${ev.title}】 ${choice.text}`);
            logMessage(choice.resultText, true);
        }

        // ★スペシャルイベント実行関数
        function triggerSpecialEvent(ev, specialData) {
            ev.played = true;
            if (ev.reusable) gameState.lastEventId = ev.id;
            else gameState.lastEventId = null;

            // ログに出力
            logMessage(`【スペシャルイベント発生！】 ${specialData.title}`);

            // 画面要素の設定
            const screen = document.getElementById('special-screen');
            // 既存の背景クラスをリセットして、新しい背景クラスを設定
            screen.className = `hidden absolute inset-0 z-50 flex flex-col items-center justify-center p-6 text-center transition-opacity duration-500 text-white ${specialData.bgClass || 'bg-gray-900'}`;
            
            document.getElementById('special-illustration').innerText = specialData.illustration || "✨";
            document.getElementById('special-title').innerText = specialData.title;
            document.getElementById('special-text').innerText = specialData.text;

            // ステータス反映用に保存（閉じる時に適用）
            screen.dataset.stats = JSON.stringify(specialData.stats || {});

            // 表示
            screen.classList.remove('hidden');
        }

        // ★スペシャルイベント終了関数
        function closeSpecialScreen() {
            const screen = document.getElementById('special-screen');
            screen.classList.add('hidden');

            // ステータス反映
            let deltas = JSON.parse(screen.dataset.stats || "{}");
            for (let k in deltas) {
                if (gameState.stats[k] !== undefined) {
                    gameState.stats[k] += deltas[k];
                }
            }
            
            initMap();
            updateStatus(deltas);
            logMessage("「…ふぅ、すごい体験だった。元の世界に戻ってこれてよかった。」", true);
        }

        let touchStartX = 0, touchStartY = 0, isSwiping = false;
        const SWIPE_THRESHOLD = 35; 
        const viewport = document.getElementById('map-viewport');

        viewport.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; isSwiping = true; }, {passive: false});
        viewport.addEventListener('touchmove', e => {
            if (!isSwiping || !document.getElementById('event-modal').classList.contains('hidden') || !document.getElementById('special-screen').classList.contains('hidden')) return;
            e.preventDefault();
            let dx = e.touches[0].clientX - touchStartX, dy = e.touches[0].clientY - touchStartY;
            if (Math.abs(dx) > SWIPE_THRESHOLD || Math.abs(dy) > SWIPE_THRESHOLD) {
                if (Math.abs(dx) > Math.abs(dy)) movePlayer(dx > 0 ? 1 : -1, 0);
                else movePlayer(0, dy > 0 ? 1 : -1);
                touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
            }
        }, {passive: false});
        viewport.addEventListener('touchend', () => isSwiping = false);

        viewport.addEventListener('mousedown', e => { isSwiping = true; touchStartX = e.clientX; touchStartY = e.clientY; });
        viewport.addEventListener('mousemove', e => {
            if (!isSwiping || !document.getElementById('event-modal').classList.contains('hidden') || !document.getElementById('special-screen').classList.contains('hidden')) return;
            let dx = e.clientX - touchStartX, dy = e.clientY - touchStartY;
            if (Math.abs(dx) > SWIPE_THRESHOLD || Math.abs(dy) > SWIPE_THRESHOLD) {
                if (Math.abs(dx) > Math.abs(dy)) movePlayer(dx > 0 ? 1 : -1, 0);
                else movePlayer(0, dy > 0 ? 1 : -1);
                touchStartX = e.clientX; touchStartY = e.clientY;
            }
        });
        window.addEventListener('mouseup', () => isSwiping = false);

        window.addEventListener('keydown', (e) => {
            if(document.getElementById('start-screen').classList.contains('hidden')) {
                if(e.key === 'ArrowUp') movePlayer(0, -1);
                if(e.key === 'ArrowDown') movePlayer(0, 1);
                if(e.key === 'ArrowLeft') movePlayer(-1, 0);
                if(e.key === 'ArrowRight') movePlayer(1, 0);
            }
        });

        window.addEventListener('resize', () => { if(document.getElementById('game-screen').classList.contains('hidden') === false) updateCameraPosition(); });

        // ========================================================
        // drawBaniChar — バニコリタン共通描画関数
        // BanicoritanPlayer とアバタープレビューで共用。
        // (ctx, cx, cy, s, t): 中心(cx,cy)にサイズsで描画。
        // ========================================================
        function drawBaniChar(ctx, cx, cy, s, t) {
            ctx.save();
            ctx.translate(cx, cy);
            // 耳（2セグメント垂れ耳ベジェ）
            for (const side of [-1, 1]) {
                const bx = side * s * 0.24, by = -s * 0.3;
                const a1 = -Math.PI / 2 + side * 0.26 + Math.sin(t * 0.007 + side * 1.3) * 0.42;
                const a2 = a1 + Math.sin(t * 0.011 + side * 2.1) * 0.58 + side * 0.18;
                const mx = bx + Math.cos(a1) * s * 0.32, my = by + Math.sin(a1) * s * 0.32;
                const tx = mx + Math.cos(a2) * s * 0.4,  ty = my + Math.sin(a2) * s * 0.4;
                ctx.strokeStyle = '#ff91c8'; ctx.lineWidth = s * 0.22; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo(mx, my, tx, ty); ctx.stroke();
            }
            // 胴体（変形アメーバブロブ）
            ctx.fillStyle = '#ff91c8'; ctx.beginPath();
            const N = 8;
            const pts = Array.from({ length: N }, (_, i) => {
                const a = (i / N) * Math.PI * 2;
                const r = s * (0.44 + Math.sin(t * 0.013 + a * 2.5) * 0.07
                                    + Math.sin(t * 0.019 + a * 1.7 + 1.3) * 0.05);
                return { x: Math.cos(a) * r * 0.88, y: s * 0.08 + Math.sin(a) * r };
            });
            for (let i = 0; i < N; i++) {
                const p1 = pts[i], p2 = pts[(i + 1) % N];
                const cpx = (p1.x + p2.x) / 2, cpy = (p1.y + p2.y) / 2;
                i === 0
                    ? ctx.moveTo((pts[N - 1].x + p1.x) / 2, (pts[N - 1].y + p1.y) / 2)
                    : ctx.quadraticCurveTo(p1.x, p1.y, cpx, cpy);
                if (i === 0) ctx.quadraticCurveTo(p1.x, p1.y, cpx, cpy);
            }
            ctx.closePath(); ctx.fill();
            // 目
            for (const side of [-1, 1]) {
                const ex = side * s * 0.15, ey = -s * 0.02;
                const pw = Math.sin(t * 0.002 + side * 0.6) * s * 0.022;
                ctx.fillStyle = 'white'; ctx.beginPath(); ctx.ellipse(ex, ey, s * 0.13, s * 0.15, 0, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(ex + pw + side * s * 0.02, ey + s * 0.02, s * 0.062, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(ex + pw - s * 0.036, ey - s * 0.025, s * 0.024, 0, Math.PI * 2); ctx.fill();
            }
            // 鼻
            ctx.fillStyle = '#dd6699'; ctx.beginPath(); ctx.ellipse(0, s * 0.15, s * 0.045, s * 0.03, 0, 0, Math.PI * 2); ctx.fill();
            // 口
            ctx.strokeStyle = '#cc5590'; ctx.lineWidth = s * 0.036; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(-s * 0.1, s * 0.23); ctx.quadraticCurveTo(0, s * 0.34, s * 0.1, s * 0.23); ctx.stroke();
            ctx.restore();
        }

        // ========================================================
        // BanicoritanPlayer — プレイアブル・バニコリタン
        // map-viewport内の全面canvasに中央固定で描画する。
        // 移動6歩ごとにスタイルを切り替え。
        // Style 0=ころころ 1=くねくね 2=ぴょんぴょん 3=ぐるぐる
        // ========================================================
        class BanicoritanPlayer {
            constructor(canvas) {
                this.canvas    = canvas;
                this.ctx       = canvas.getContext('2d');
                this.SIZE      = 34;
                this.animTime  = 0;
                this.stepCount = 0;
                this.style     = 0;
                this.rollAngle = 0;
                this.moveEase  = 0; // 1→0 in ~300ms after each move

                let last = performance.now();
                const tick = (now) => {
                    const dt = Math.min(now - last, 100);
                    last = now;
                    const ow = this.canvas.offsetWidth, oh = this.canvas.offsetHeight;
                    if (this.canvas.width !== ow || this.canvas.height !== oh) {
                        this.canvas.width = ow; this.canvas.height = oh;
                    }
                    this.animTime += dt;
                    if (this.moveEase > 0) this.moveEase = Math.max(0, this.moveEase - dt / 300);
                    this._draw();
                    requestAnimationFrame(tick);
                };
                requestAnimationFrame(tick);
            }

            onMove(dx, dy) {
                this.moveEase  = 1;
                this.stepCount++;
                const spin = dx !== 0 ? dx : dy;
                if (this.style === 0 || this.style === 3) this.rollAngle += spin * 0.9;
                if (this.stepCount % 6 === 0) this.style = (this.style + 1) % 4;
            }

            _draw() {
                const ctx = this.ctx;
                const w = this.canvas.width, h = this.canvas.height;
                if (!w || !h) return;
                ctx.clearRect(0, 0, w, h);
                const s = this.SIZE, t = this.animTime, e = this.moveEase;

                ctx.save();
                ctx.translate(w / 2, h / 2);

                if (this.style === 0) {
                    // ころころ: 移動方向に転がる
                    ctx.rotate(this.rollAngle + Math.sin(t * 0.004) * 0.08);
                } else if (this.style === 1) {
                    // くねくね: 横に蛇行シアー
                    const shear = Math.sin(t * 0.012) * (0.3 + e * 0.25);
                    ctx.transform(1, shear, 0, 1, 0, 0);
                } else if (this.style === 2) {
                    // ぴょんぴょん: スカッシュ＆ストレッチ＋上下バウンス
                    const phase = Math.abs(Math.sin(t * 0.016));
                    const bounce = -phase * s * (0.35 + e * 0.35);
                    ctx.translate(0, bounce);
                    ctx.scale(1 + phase * 0.18, 1 - phase * 0.12);
                } else {
                    // ぐるぐる: 高速回転
                    ctx.rotate(this.rollAngle + t * 0.009);
                }

                drawBaniChar(ctx, 0, 0, s, t);
                ctx.restore();

                // 現在スタイル名を足元にふわっと表示
                const labels = ['ころころ', 'くねくね', 'ぴょんぴょん', 'ぐるぐる'];
                const alpha  = 0.35 + e * 0.45;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle   = '#ff91c8';
                ctx.font        = 'bold 9px sans-serif';
                ctx.textAlign   = 'center';
                ctx.fillText(labels[this.style], w / 2, h / 2 + s * 1.15);
                ctx.restore();
            }
        }

        // アバタープレビュー用アニメーション
        function initBaniAvatarPreview() {
            const canvas = document.getElementById('bani-preview-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let t = 0;
            const tick = () => {
                t += 16;
                ctx.clearRect(0, 0, 36, 36);
                drawBaniChar(ctx, 18, 20, 14, t);
                requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
        }

        // ========================================================
        // バニコリタン2（オープニング画面イースターエッグ）
        // セグメント式アクティブ・ラグドール。
        // キャラクター画像差し替えは _drawBodyAt() を置き換えること。
        // ========================================================
        class Banikolitan2 {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx    = canvas.getContext('2d');
                this.S      = 13; // 関節の基本単位(px)

                this.PEEK_DELAY    = 5000;
                this.DASH_DELAY    = 15000;
                this.PEEK_COOLDOWN = 20000;
                this.PEEK_IN_MS    = 800;
                this.PEEK_HOLD_MS  = 2000;
                this.PEEK_OUT_MS   = 600;

                this.state        = 'normal';
                this.animTime     = 0;
                this.lastActivity = Date.now();
                this.lastPeekTime = -99999;

                this.peekProgress = 0;
                this.peekPhase    = 'in';
                this.peekTimer    = 0;
                this.peekSide     = 1;

                this.dashX     = 0;
                this.dashY     = 0;
                this.dashSpeed = 0;
                this.dashTime  = 0;

                ['click', 'touchstart', 'keydown', 'mousedown'].forEach(ev =>
                    window.addEventListener(ev, () => this._onActivity(), { passive: true })
                );

                let last = performance.now();
                const tick = (now) => {
                    const dt = Math.min(now - last, 100);
                    last = now;
                    const ow = this.canvas.offsetWidth;
                    const oh = this.canvas.offsetHeight;
                    if (this.canvas.width !== ow || this.canvas.height !== oh) {
                        this.canvas.width = ow; this.canvas.height = oh;
                    }
                    this._update(dt);
                    this._draw();
                    requestAnimationFrame(tick);
                };
                requestAnimationFrame(tick);
            }

            _onActivity() {
                this.lastActivity = Date.now();
                if (this.state === 'peek') { this.peekPhase = 'out'; this.peekTimer = 0; }
            }

            _update(dt) {
                this.animTime += dt;
                // ゲーム開始後は停止
                if (!document.getElementById('start-screen') ||
                    document.getElementById('start-screen').classList.contains('hidden')) return;

                const inactive = Date.now() - this.lastActivity;
                if (this.state === 'dash') { this._updateDash(dt); return; }
                if (inactive >= this.DASH_DELAY) { this._startDash(); return; }
                if (this.state === 'peek') { this._updatePeek(dt); return; }
                if (inactive >= this.PEEK_DELAY &&
                    Date.now() - this.lastPeekTime > this.PEEK_COOLDOWN) this._startPeek();
            }

            _startPeek() {
                this.state = 'peek'; this.peekPhase = 'in';
                this.peekProgress = 0; this.peekTimer = 0;
                this.peekSide = Math.random() > 0.5 ? 1 : -1;
            }

            _updatePeek(dt) {
                this.peekTimer += dt;
                if (this.peekPhase === 'in') {
                    this.peekProgress = Math.min(1, this.peekTimer / this.PEEK_IN_MS);
                    if (this.peekProgress >= 1) { this.peekPhase = 'hold'; this.peekTimer = 0; }
                } else if (this.peekPhase === 'hold') {
                    if (this.peekTimer >= this.PEEK_HOLD_MS) { this.peekPhase = 'out'; this.peekTimer = 0; }
                } else {
                    this.peekProgress = Math.max(0, 1 - this.peekTimer / this.PEEK_OUT_MS);
                    if (this.peekProgress <= 0) { this.state = 'normal'; this.lastPeekTime = Date.now(); }
                }
            }

            _startDash() {
                this.state = 'dash';
                const w = this.canvas.width || 400;
                const h = this.canvas.height || 700;
                this.dashX     = -(this.S * 6);
                this.dashY     = h * 0.25 + Math.random() * h * 0.45;
                this.dashSpeed = (w + this.S * 12) / 2400;
                this.dashTime  = 0;
            }

            _updateDash(dt) {
                this.dashTime += dt;
                this.dashX += this.dashSpeed * dt;
                if (this.dashX > this.canvas.width + this.S * 6) {
                    this.state = 'normal'; this.lastActivity = Date.now();
                }
            }

            // セグメント座標をフォワードキネマティクスで計算
            _computeBody(rootX, rootY, t) {
                const S = this.S;

                // 骨盤（ルート）
                const hip = { x: rootX, y: rootY };

                // 脊椎（2セグメント）
                const s1a = -Math.PI / 2 + Math.sin(t * 0.013) * 0.35 + Math.sin(t * 0.021 + 1.0) * 0.2;
                const s2a = s1a + Math.sin(t * 0.017 + 0.7) * 0.3 + Math.sin(t * 0.029 + 2.1) * 0.15;
                const torsoMid = { x: hip.x + Math.cos(s1a) * S * 1.1, y: hip.y + Math.sin(s1a) * S * 1.1 };
                const shoulder = { x: torsoMid.x + Math.cos(s2a) * S * 0.9, y: torsoMid.y + Math.sin(s2a) * S * 0.9 };
                const headPos  = { x: shoulder.x + Math.cos(s2a) * S * 0.55, y: shoulder.y + Math.sin(s2a) * S * 0.55 };

                // 左腕
                const la1a = s2a + Math.PI * 0.45 + Math.sin(t * 0.025) * 0.9 + Math.sin(t * 0.041 + 1.2) * 0.5;
                const la2a = la1a + Math.sin(t * 0.033 + 0.5) * 1.2 + 0.9;
                const lElbow = { x: shoulder.x + Math.cos(la1a) * S * 1.1, y: shoulder.y + Math.sin(la1a) * S * 1.1 };
                const lHand  = { x: lElbow.x  + Math.cos(la2a) * S * 1.0, y: lElbow.y  + Math.sin(la2a) * S * 1.0 };

                // 右腕
                const ra1a = s2a - Math.PI * 0.45 + Math.sin(t * 0.025 + Math.PI) * 0.9 + Math.sin(t * 0.041 + 2.7) * 0.5;
                const ra2a = ra1a + Math.sin(t * 0.033 + 1.5) * 1.2 - 0.9;
                const rElbow = { x: shoulder.x + Math.cos(ra1a) * S * 1.1, y: shoulder.y + Math.sin(ra1a) * S * 1.1 };
                const rHand  = { x: rElbow.x  + Math.cos(ra2a) * S * 1.0, y: rElbow.y  + Math.sin(ra2a) * S * 1.0 };

                // 左脚
                const ll1a = Math.PI * 0.5 - 0.22 + Math.sin(t * 0.019) * 0.55 + Math.sin(t * 0.031 + 0.8) * 0.35;
                const ll2a = ll1a + Math.sin(t * 0.027 + 0.3) * 0.75 + 0.45;
                const lKnee = { x: hip.x + Math.cos(ll1a) * S * 1.2, y: hip.y + Math.sin(ll1a) * S * 1.2 };
                const lFoot = { x: lKnee.x + Math.cos(ll2a) * S * 1.1, y: lKnee.y + Math.sin(ll2a) * S * 1.1 };

                // 右脚
                const rl1a = Math.PI * 0.5 + 0.22 + Math.sin(t * 0.019 + Math.PI) * 0.55 + Math.sin(t * 0.031 + Math.PI + 0.8) * 0.35;
                const rl2a = rl1a + Math.sin(t * 0.027 + Math.PI + 0.3) * 0.75 + 0.45;
                const rKnee = { x: hip.x + Math.cos(rl1a) * S * 1.2, y: hip.y + Math.sin(rl1a) * S * 1.2 };
                const rFoot = { x: rKnee.x + Math.cos(rl2a) * S * 1.1, y: rKnee.y + Math.sin(rl2a) * S * 1.1 };

                return { hip, torsoMid, shoulder, headPos, lElbow, lHand, rElbow, rHand, lKnee, lFoot, rKnee, rFoot };
            }

            // キャラクター描画（差し替え口: rootX, rootY, t を引数に取る）
            _drawBodyAt(ctx, rootX, rootY, t) {
                const S = this.S;
                const b = this._computeBody(rootX, rootY, t);

                // 軟体ベジェ肢: 中点を垂直方向にうねらせて触手感を出す
                const softLimb = (p1, p2, bend, width) => {
                    const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
                    const dx = p2.x - p1.x, dy = p2.y - p1.y;
                    const len = Math.sqrt(dx * dx + dy * dy) || 1;
                    ctx.save();
                    ctx.strokeStyle = '#ff91c8'; ctx.lineWidth = width; ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.quadraticCurveTo(mx + (-dy / len) * bend, my + (dx / len) * bend, p2.x, p2.y);
                    ctx.stroke();
                    ctx.restore();
                };

                // 脚（ぐにゃぐにゃ）
                softLimb(b.hip, b.lKnee,  Math.sin(t * 0.021 + 0.3)          * S * 1.1, S * 0.52);
                softLimb(b.lKnee, b.lFoot, Math.sin(t * 0.033 + 1.1)          * S * 1.1, S * 0.46);
                softLimb(b.hip, b.rKnee,  Math.sin(t * 0.021 + Math.PI + 0.3) * S * 1.1, S * 0.52);
                softLimb(b.rKnee, b.rFoot, Math.sin(t * 0.033 + Math.PI + 1.1) * S * 1.1, S * 0.46);

                // 脊椎（波打つ）
                const spW = Math.sin(t * 0.015 + 0.5) * S * 0.7;
                softLimb(b.hip, b.torsoMid,   spW,        S * 0.88);
                softLimb(b.torsoMid, b.shoulder, -spW * 0.7, S * 0.82);

                // 胴体ブロブ（変形するアメーバ状）
                ctx.fillStyle = '#ff91c8';
                ctx.beginPath();
                const BN = 7;
                const bpts = Array.from({ length: BN }, (_, i) => {
                    const a = (i / BN) * Math.PI * 2;
                    const r = S * (0.85 + Math.sin(t * 0.017 + a * 2.5) * 0.18
                                        + Math.sin(t * 0.029 + a * 1.8 + 1.1) * 0.1);
                    return { x: b.torsoMid.x + Math.cos(a) * r, y: b.torsoMid.y + Math.sin(a) * r * 0.82 };
                });
                for (let i = 0; i < BN; i++) {
                    const p1 = bpts[i], p2 = bpts[(i + 1) % BN];
                    const cpx = (p1.x + p2.x) / 2, cpy = (p1.y + p2.y) / 2;
                    i === 0
                        ? ctx.moveTo((bpts[BN - 1].x + p1.x) / 2, (bpts[BN - 1].y + p1.y) / 2)
                        : ctx.quadraticCurveTo(p1.x, p1.y, cpx, cpy);
                    if (i === 0) ctx.quadraticCurveTo(p1.x, p1.y, cpx, cpy);
                }
                ctx.closePath(); ctx.fill();

                // 腕（触手のようにうねる）
                softLimb(b.shoulder, b.lElbow,  Math.sin(t * 0.027 + 0.7)          * S * 1.3, S * 0.46);
                softLimb(b.lElbow, b.lHand,     Math.sin(t * 0.039 + 1.5)          * S * 1.3, S * 0.4);
                softLimb(b.shoulder, b.rElbow,  Math.sin(t * 0.027 + Math.PI + 0.7) * S * 1.3, S * 0.46);
                softLimb(b.rElbow, b.rHand,     Math.sin(t * 0.039 + Math.PI + 1.5) * S * 1.3, S * 0.4);

                // 頭（ちょっとふらふら）
                const hWob = Math.sin(t * 0.009) * S * 0.25;
                ctx.fillStyle = '#ff91c8';
                ctx.beginPath();
                ctx.arc(b.headPos.x + hWob, b.headPos.y, S * 0.75, 0, Math.PI * 2);
                ctx.fill();
                const hx = b.headPos.x + hWob, hy = b.headPos.y;

                // 耳（2セグメントの垂れ耳ベジェ）
                for (const side of [-1, 1]) {
                    const bx = hx + side * S * 0.42, by = hy - S * 0.52;
                    const a1 = -Math.PI / 2 + side * 0.28 + Math.sin(t * 0.006 + side * 1.4) * 0.5;
                    const a2 = a1 + Math.sin(t * 0.009 + side * 2.2) * 0.6 + side * 0.22;
                    const mx = bx + Math.cos(a1) * S * 0.45, my = by + Math.sin(a1) * S * 0.45;
                    const tx = mx + Math.cos(a2) * S * 0.55, ty = my + Math.sin(a2) * S * 0.55;
                    ctx.strokeStyle = '#ff91c8'; ctx.lineWidth = S * 0.36; ctx.lineCap = 'round';
                    ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo(mx, my, tx, ty); ctx.stroke();
                }

                // 目（まぬけ）
                for (const side of [-1, 1]) {
                    const ex = hx + side * S * 0.3, ey = hy - S * 0.05;
                    const pw = Math.sin(t * 0.002 + side * 0.6) * S * 0.07;
                    ctx.fillStyle = 'white';
                    ctx.beginPath(); ctx.ellipse(ex, ey, S * 0.22, S * 0.25, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#1a1a1a';
                    ctx.beginPath(); ctx.arc(ex + pw + side * S * 0.04, ey + S * 0.04, S * 0.11, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = 'white';
                    ctx.beginPath(); ctx.arc(ex + pw - S * 0.06, ey - S * 0.05, S * 0.046, 0, Math.PI * 2); ctx.fill();
                }

                // 口
                ctx.save();
                ctx.strokeStyle = '#cc5590'; ctx.lineWidth = S * 0.07; ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(hx - S * 0.2, hy + S * 0.2);
                ctx.quadraticCurveTo(hx, hy + S * 0.37, hx + S * 0.2, hy + S * 0.2);
                ctx.stroke();
                ctx.restore();
            }

            _draw() {
                const ctx = this.ctx;
                const w   = this.canvas.width;
                const h   = this.canvas.height;
                ctx.clearRect(0, 0, w, h);
                if (this.state === 'normal') return;
                if (this.state === 'peek') this._drawPeek(ctx, w, h);
                else                       this._drawDash(ctx, w, h);
            }

            _drawPeek(ctx, w, h) {
                const t  = this.animTime;
                const p  = this.peekProgress;
                const S  = this.S;
                const sd = this.peekSide;

                // 端からルートが顔を出す量
                const reveal = S * 5 * p;
                const rootX  = sd === 1 ? w - reveal + S * 2.5 : reveal - S * 2.5;
                const rootY  = h * 0.44 + Math.sin(t * 0.011) * S * 0.6;

                ctx.save();
                ctx.beginPath(); ctx.rect(0, 0, w, h); ctx.clip();
                this._drawBodyAt(ctx, rootX, rootY, t);
                ctx.restore();
            }

            _drawDash(ctx, w, h) {
                const t  = this.animTime;
                const dt = this.dashTime;

                // 駆け抜け中の激しいY上下（スーパーバニーマン風）
                const wy = (time) =>
                    Math.sin(time * 0.018) * 30 + Math.sin(time * 0.031 + 1.4) * 20
                  + Math.sin(time * 0.051 + 2.8) * 10;

                // 残像トレイル
                for (let i = 3; i >= 1; i--) {
                    const lag = i * 110;
                    const lx  = this.dashX - this.dashSpeed * lag;
                    ctx.save();
                    ctx.globalAlpha = 0.15 / i;
                    this._drawBodyAt(ctx, lx, this.dashY + wy(dt - lag), t - lag);
                    ctx.restore();
                }

                this._drawBodyAt(ctx, this.dashX, this.dashY + wy(dt), t);
            }
        }

        // バニコリタン2 はページロード時に起動（スタート画面専用）
        window.addEventListener('DOMContentLoaded', () => {
            const c2 = document.getElementById('banicori2-canvas');
            if (c2) window.__banicoritan2 = new Banikolitan2(c2);
            initBaniAvatarPreview();
        });

        // ========================================================
        // バニコリタン（イースターエッグ）
        // 放置タイマーで出現するシュールなキャラクター。
        // キャラクター画像への差し替えは _drawChar() を置き換えること。
        // ========================================================
        class Banicoritan {
            constructor(canvas) {
                this.canvas  = canvas;
                this.ctx     = canvas.getContext('2d');
                this.SIZE    = 44;

                // タイミング設定（ms）
                this.PEEK_DELAY    = 5000;
                this.DASH_DELAY    = 15000;
                this.PEEK_COOLDOWN = 25000;
                this.PEEK_IN_MS    = 700;
                this.PEEK_HOLD_MS  = 1500;
                this.PEEK_OUT_MS   = 500;

                this.state        = 'idle';
                this.animTime     = 0;
                this.lastActivity = Date.now();
                this.lastPeekTime = -99999;

                // ひょっこり用
                this.peekProgress = 0;
                this.peekPhase    = 'in';
                this.peekTimer    = 0;

                // 駆け抜け用
                this.dashX     = 0;
                this.dashY     = 0;
                this.dashDir   = 1;
                this.dashTime  = 0;
                this.dashSpeed = 0;

                // 入力検知（駆け抜け中は状態変化しない）
                ['click', 'touchstart', 'keydown', 'mousedown'].forEach(ev =>
                    window.addEventListener(ev, () => this._onActivity(), { passive: true })
                );

                let last = performance.now();
                const tick = (now) => {
                    const dt = Math.min(now - last, 100);
                    last = now;
                    const ow = this.canvas.offsetWidth;
                    const oh = this.canvas.offsetHeight;
                    if (this.canvas.width !== ow || this.canvas.height !== oh) {
                        this.canvas.width = ow;
                        this.canvas.height = oh;
                    }
                    this._update(dt);
                    this._draw();
                    requestAnimationFrame(tick);
                };
                requestAnimationFrame(tick);
            }

            _onActivity() {
                this.lastActivity = Date.now();
                if (this.state === 'peeking') {
                    // 操作されたら即座に引っ込む
                    this.peekPhase = 'out';
                    this.peekTimer = 0;
                }
                // 駆け抜け中は中断しない
            }

            _update(dt) {
                this.animTime += dt;
                const inactive = Date.now() - this.lastActivity;

                if (this.state === 'dashing') {
                    this._updateDash(dt);
                    return;
                }

                // 15秒放置 → 駆け抜け（ひょっこり中でも上書き）
                if (inactive >= this.DASH_DELAY) {
                    this._startDash();
                    return;
                }

                if (this.state === 'peeking') {
                    this._updatePeek(dt);
                    return;
                }

                // 5秒放置 + クールダウン明け → ひょっこり
                if (inactive >= this.PEEK_DELAY &&
                    Date.now() - this.lastPeekTime > this.PEEK_COOLDOWN) {
                    this._startPeek();
                }
            }

            _startPeek() {
                this.state        = 'peeking';
                this.peekPhase    = 'in';
                this.peekProgress = 0;
                this.peekTimer    = 0;
            }

            _updatePeek(dt) {
                this.peekTimer += dt;
                if (this.peekPhase === 'in') {
                    this.peekProgress = Math.min(1, this.peekTimer / this.PEEK_IN_MS);
                    if (this.peekProgress >= 1) { this.peekPhase = 'hold'; this.peekTimer = 0; }
                } else if (this.peekPhase === 'hold') {
                    if (this.peekTimer >= this.PEEK_HOLD_MS) { this.peekPhase = 'out'; this.peekTimer = 0; }
                } else {
                    this.peekProgress = Math.max(0, 1 - this.peekTimer / this.PEEK_OUT_MS);
                    if (this.peekProgress <= 0) {
                        this.state        = 'idle';
                        this.lastPeekTime = Date.now();
                    }
                }
            }

            _startDash() {
                this.state     = 'dashing';
                const w = this.canvas.width  || 400;
                const h = this.canvas.height || 700;
                this.dashDir   = Math.random() > 0.5 ? 1 : -1;
                this.dashX     = this.dashDir === 1 ? -(this.SIZE * 2) : w + this.SIZE * 2;
                this.dashY     = h * 0.2 + Math.random() * h * 0.55;
                this.dashSpeed = (w + this.SIZE * 4) / 2200;
                this.dashTime  = 0;
            }

            _updateDash(dt) {
                this.dashTime += dt;
                this.dashX += this.dashDir * this.dashSpeed * dt;
                const w    = this.canvas.width;
                const done = this.dashDir === 1
                    ? this.dashX >  w + this.SIZE * 2
                    : this.dashX < -(this.SIZE * 2);
                if (done) {
                    this.state        = 'idle';
                    this.lastActivity = Date.now();
                }
            }

            _draw() {
                const ctx = this.ctx;
                const w   = this.canvas.width;
                const h   = this.canvas.height;
                ctx.clearRect(0, 0, w, h);
                if (this.state === 'idle') return;
                if (this.state === 'peeking') this._drawPeek(ctx, w, h);
                else                          this._drawDash(ctx, w, h);
            }

            // キャラクター描画（将来の画像差し替えはここを置き換える）
            _drawChar(ctx, x, y) {
                const s = this.SIZE;
                const t = this.animTime;
                ctx.save();
                ctx.translate(x, y);

                // 影
                ctx.fillStyle = 'rgba(0,0,0,0.07)';
                ctx.beginPath();
                ctx.ellipse(0, s * 0.6, s * 0.38 + Math.sin(t * 0.011) * s * 0.04, s * 0.08, 0, 0, Math.PI * 2);
                ctx.fill();

                // 耳（2セグメントの垂れ耳ベジェ — 軟体感）
                for (const side of [-1, 1]) {
                    const bx = side * s * 0.24, by = -s * 0.3;
                    const a1 = -Math.PI / 2 + side * 0.26 + Math.sin(t * 0.007 + side * 1.3) * 0.42;
                    const a2 = a1 + Math.sin(t * 0.011 + side * 2.1) * 0.58 + side * 0.18;
                    const mx = bx + Math.cos(a1) * s * 0.32, my = by + Math.sin(a1) * s * 0.32;
                    const tx = mx + Math.cos(a2) * s * 0.4,  ty = my + Math.sin(a2) * s * 0.4;
                    ctx.strokeStyle = '#ff8c2a'; ctx.lineWidth = s * 0.22; ctx.lineCap = 'round';
                    ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo(mx, my, tx, ty); ctx.stroke();
                }

                // 胴体（変形アメーバブロブ）
                ctx.fillStyle = '#ff8c2a';
                ctx.beginPath();
                const N = 8;
                const pts = Array.from({ length: N }, (_, i) => {
                    const a = (i / N) * Math.PI * 2;
                    const r = s * (0.44 + Math.sin(t * 0.013 + a * 2.5) * 0.07
                                        + Math.sin(t * 0.019 + a * 1.7 + 1.3) * 0.05);
                    return { x: Math.cos(a) * r * 0.88, y: s * 0.08 + Math.sin(a) * r };
                });
                for (let i = 0; i < N; i++) {
                    const p1 = pts[i], p2 = pts[(i + 1) % N];
                    const cpx = (p1.x + p2.x) / 2, cpy = (p1.y + p2.y) / 2;
                    i === 0
                        ? ctx.moveTo((pts[N - 1].x + p1.x) / 2, (pts[N - 1].y + p1.y) / 2)
                        : ctx.quadraticCurveTo(p1.x, p1.y, cpx, cpy);
                    if (i === 0) ctx.quadraticCurveTo(p1.x, p1.y, cpx, cpy);
                }
                ctx.closePath(); ctx.fill();

                // 目（まぬけ）
                for (const side of [-1, 1]) {
                    const ex = side * s * 0.15, ey = -s * 0.02;
                    const pw = Math.sin(t * 0.002 + side * 0.6) * s * 0.022;
                    ctx.fillStyle = 'white';
                    ctx.beginPath(); ctx.ellipse(ex, ey, s * 0.13, s * 0.15, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#1a1a1a';
                    ctx.beginPath(); ctx.arc(ex + pw + side * s * 0.02, ey + s * 0.02, s * 0.062, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = 'white';
                    ctx.beginPath(); ctx.arc(ex + pw - s * 0.036, ey - s * 0.025, s * 0.024, 0, Math.PI * 2); ctx.fill();
                }

                // 鼻
                ctx.fillStyle = '#cc5500';
                ctx.beginPath(); ctx.ellipse(0, s * 0.15, s * 0.045, s * 0.03, 0, 0, Math.PI * 2); ctx.fill();

                // まぬけな口
                ctx.strokeStyle = '#cc5500'; ctx.lineWidth = s * 0.036; ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(-s * 0.1, s * 0.23);
                ctx.quadraticCurveTo(0, s * 0.34, s * 0.1, s * 0.23);
                ctx.stroke();

                ctx.restore();
            }

            _drawPeek(ctx, w, h) {
                const t = this.animTime;
                const p = this.peekProgress;
                const s = this.SIZE;

                // 細かく不気味にうねうね（複数周波数）
                const wx = Math.sin(t * 0.018) * 2.2 + Math.sin(t * 0.033) * 1.4;
                const wy = Math.sin(t * 0.024) * 2.8 + Math.sin(t * 0.013) * 1.8;
                const wr = Math.sin(t * 0.02) * 0.038;

                // 右端からスライドイン（p=0: 画面外, p=1: 顔の左半分が見える）
                const cx = w + s * 0.5 - s * 0.9 * p + wx;
                const cy = h * 0.44 + wy;

                ctx.save();
                ctx.beginPath(); ctx.rect(0, 0, w, h); ctx.clip();
                ctx.translate(cx, cy);
                ctx.rotate(wr);
                this._drawChar(ctx, 0, 0);
                ctx.restore();
            }

            _drawDash(ctx, w, h) {
                const t = this.dashTime;
                const s = this.SIZE;

                // スーパーバニーマン風ラグドール（多周波サイン合成・位相ずらし）
                const wy = Math.sin(t * 0.012) * 38
                         + Math.sin(t * 0.019 + 1.2) * 24
                         + Math.sin(t * 0.034 + 2.8) * 14
                         + Math.sin(t * 0.007 + 0.5) * 20;
                const wr = (Math.sin(t * 0.015) * 0.28
                          + Math.sin(t * 0.027 + 1.0) * 0.14) * this.dashDir;
                const sq = Math.abs(Math.sin(t * 0.022));
                const sx = this.dashDir * (1 + sq * 0.22);
                const sy = 1 - sq * 0.12;

                // 残像トレイル（スピード感）
                for (let i = 2; i >= 1; i--) {
                    const lag = i * 140;
                    const lt  = Math.max(0, t - lag);
                    const lwy = Math.sin(lt * 0.012) * 38
                              + Math.sin(lt * 0.019 + 1.2) * 24
                              + Math.sin(lt * 0.034 + 2.8) * 14;
                    const lx  = this.dashX - this.dashDir * this.dashSpeed * lag;
                    ctx.save();
                    ctx.globalAlpha = 0.18 / i;
                    ctx.translate(lx, this.dashY + lwy);
                    ctx.scale(this.dashDir, 1);
                    this._drawChar(ctx, 0, 0);
                    ctx.restore();
                }

                // 本体
                ctx.save();
                ctx.translate(this.dashX, this.dashY + wy);
                ctx.rotate(wr);
                ctx.scale(sx, sy);
                this._drawChar(ctx, 0, 0);
                ctx.restore();
            }
        }

        let _banicoritanInited = false;
        function initBanicoritan() {
            if (_banicoritanInited) return;
            _banicoritanInited = true;
            window.__banicoritan = new Banicoritan(document.getElementById('banicori-canvas'));
        }

        function showSaveMock() {
            document.getElementById('save-data-display').value = JSON.stringify(gameState);
            document.getElementById('save-modal').classList.remove('hidden');
        }
        function closeSaveMock() { document.getElementById('save-modal').classList.add('hidden'); }
    </script>
</body>
